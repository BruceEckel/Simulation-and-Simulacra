[package]
name = "giraffe"
description = "A spatial prisoner's dilemma in which some of the players say what they need, and a dial for how often needs truly conflict."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fulcrum = { workspace = true }
# The `assets!()` this crate's `main` calls: the simulation's assets, inside its own
# executable. See crates/simulacra-assets.
simulacra-assets = { workspace = true }
env_logger = { workspace = true }
# Manifest-only: lets #[derive(Component)] resolve the `bevy_ecs::` paths it generates.
# Game source imports only fulcrum::prelude.
bevy_ecs = { workspace = true }
# For the borderless fullscreen switch and hiding the cursor, which are window operations:
# the window handle (fulcrum-render) and the fullscreen mode it takes (winit).
fulcrum-render = { workspace = true }
winit = { workspace = true }
