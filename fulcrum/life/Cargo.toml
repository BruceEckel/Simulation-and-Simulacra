[package]
name = "life"
description = "Conway's Game of Life and forty-three of its relatives, from blocky cells down to one per pixel."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fulcrum = { workspace = true }
# The `assets!()` this crate's `main` calls: the simulation's assets, inside its own
# executable. See crates/simulacra-assets.
simulacra-assets = { workspace = true }
env_logger = { workspace = true }
# Manifest-only: lets #[derive(Component)] resolve the `bevy_ecs::` paths it generates.
# Game source imports only fulcrum::prelude.
bevy_ecs = { workspace = true }
# This piece runs its own render pass: it reaches beneath the facade for the device and queue
# (fulcrum-render), the pipeline and the shader (wgpu), the borderless fullscreen switch
# (winit) and the uniform byte-cast (bytemuck).
#
# A grid of tinted sprites was never an option here. At one cell to the pixel a full display is
# millions of cells, and the whole point of the resolution control is that it goes that far, so
# the field is uploaded as a texture and coloured in a fragment program instead.
fulcrum-render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# The `still` example renders a frame on a headless device and writes it to a PNG, which is
# how the colour schemes were tuned and where the timings come from.
image = { workspace = true }
pollster = { workspace = true }
