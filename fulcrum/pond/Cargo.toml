[package]
name = "pond"
description = "A pond at dusk that answers the pointer slowly and asks nothing: rings, a wake, and a lantern that walks when you leave it alone."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fulcrum = { workspace = true }
# The `assets!()` this crate's `main` calls: the simulation's assets, inside its own
# executable. See crates/simulacra-assets.
simulacra-assets = { workspace = true }
# The offscreen frame this piece's pass draws into, and the sprite that shows it. Shared with
# the other pieces that compute every pixel themselves.
simulacra-frame = { workspace = true }
env_logger = { workspace = true }
# Manifest-only: lets #[derive(Component)] resolve the `bevy_ecs::` paths it generates.
# Game source imports only fulcrum::prelude.
bevy_ecs = { workspace = true }
# This piece runs its own render pass: it reaches beneath the facade for the device and queue
# (fulcrum-render), the pipeline and the shader (wgpu), the borderless fullscreen switch and
# the cursor (winit) and the uniform byte-cast (bytemuck).
#
# The water is a height field with a value in every cell, and the picture is that field lit
# and refracted at every pixel. That is a fragment program's job: the field goes up as a
# texture once a tick and the shader does the rest.
fulcrum-render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# The `still` example renders a frame on a headless device and writes it to a PNG, which is
# how the palettes and the lighting were tuned.
image = { workspace = true }
pollster = { workspace = true }
