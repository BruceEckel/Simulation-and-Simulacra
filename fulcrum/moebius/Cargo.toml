[package]
name = "moebius"
description = "Moebius clouds: cloud outlines built from circular arcs, filled flat, one colour to an enclosed region."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fulcrum = { workspace = true }
# The `assets!()` this crate's `main` calls: the simulation's assets, inside its own
# executable. See crates/simulacra-assets.
simulacra-assets = { workspace = true }
env_logger = { workspace = true }
# Manifest-only: lets #[derive(Component)] resolve the `bevy_ecs::` paths it generates.
# Game source imports only fulcrum::prelude.
bevy_ecs = { workspace = true }
# This piece runs its own render pass: it reaches beneath the facade for the device and queue
# (fulcrum-render), the pipeline and the shader (wgpu), the borderless fullscreen switch
# (winit) and the uniform byte-cast (bytemuck).
fulcrum-render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# The `moebius_still` example renders a frame on a headless device and writes it to a PNG,
# which is how the drawing was tuned.
image = { workspace = true }
pollster = { workspace = true }
